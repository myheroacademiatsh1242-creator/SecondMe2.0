const canvas=document.querySelector('canvas'),screenCtx=canvas.getContext('2d');let g=screenCtx;

const BUF_X=24,BUF_Y=34,buffer=document.createElement('canvas');buffer.width=360;buffer.height=330;const bufCtx=buffer.getContext('2d'),$=id=>document.getElementById(id);
const names=['Hộp Quà','Người Tuyết','Gậy Kẹo'],prizeText=['+25 xu','+1 ấn rune','+10 xu'],colors=['#ffcb62','#a9e3f5','#f28c98'];
let coins=0,cost=1,claw,grab,prizes,ended,t=0,last=0;
let cameraPhase=0;
let paid=false,coinTime=null;
let depth=30,stick=null,pickupQueue=[],reward=null;
const chute={x:25,z:16}, controls3D={stick:[65,81,-17],blue:[91,71,-17],red:[117,71,-17]};
const guide='Bấm NẠP để dùng vé Noel cho 1 lượt. Sau đó kéo cần để ngắm và bấm GẮP.';
const parentWin=window.parent!==window?window.parent:null,post=m=>parentWin&&parentWin.postMessage(m,location.origin);let waiting=false;
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parentWin)return;const m=e.data||{};
 if(m.type!=='claw:tickets')return;coins=m.tickets|0;cost=(m.cost|0)||cost;
 if(waiting){waiting=false;if(m.ok){coinTime=0;ui('Đang nạp vé…')}else ui('Không đủ vé Noel. Săn quái để kiếm thêm vé.')}else ui()});
// Offset and velocity of the hanging head relative to the moving carriage.
function swingAxis(){return {offset:0,speed:0,railSpeed:0}}
let swingX,swingZ;
function advanceSwing(axis,travel,dt){
 if(dt<=0)return;
 const railSpeed=travel/dt;
 axis.speed-=.85*(railSpeed-axis.railSpeed);axis.railSpeed=railSpeed;
 const steps=Math.ceil(dt*120),h=dt/steps;
 for(let i=0;i<steps;i++){
   axis.speed+=(-68*axis.offset-4.6*axis.speed)*h;
   axis.offset+=axis.speed*h;
 }
}
let buttonPress={blue:-10,red:-10};
function buttonDepth(name){
 const age=t-buttonPress[name];
 if(age<0||age>.32)return 0;
 if(age<.065)return 2.6*ease(age/.065);
 if(age<.12)return 2.6;
 const rebound=(age-.12)/.2;
 return 2.6*Math.exp(-5*rebound)*Math.cos(rebound*Math.PI*2.5)*(1-ease(rebound))
}
function reset(){buttonPress={blue:-10,red:-10};swingX=swingAxis();swingZ=swingAxis();cameraPhase=0;paid=false;coinTime=null;claw=99;depth=31;stick=null;pickupQueue=[];reward=null;grab=null;prizes=[];
// Fill the bed in layers while keeping the topmost prizes legible from both views.
for(let i=0;i<90;i++){
 const k=i%3;
 const variants=modelsByPrize[k],model=variants[Math.floor(i/3)%variants.length];
 const tilt=(Math.random()<.5?-1:1)*(.2+Math.random()*(k===0?.75:1.65));
 let bestSpot=null,bestScore=-Infinity;
 for(let attempt=0;attempt<5;attempt++){
   const x=49+Math.random()*99,z=10+Math.random()*42,y=restHeight(x,z,prizes);
   let clearance=Infinity;
   for(const other of prizes){
     const dx=x-other.x,dz=z-other.z,dy=y-other.y;
     const frontGap=Math.hypot(dx,dy+.46*dz);
     const angledGap=Math.hypot(dx+.57*dz,.105*dx-dy-.34*dz);
     clearance=Math.min(clearance,frontGap,angledGap);
   }
   const score=Math.min(clearance,14)-(y-91)*.65;
   if(score>bestScore){bestScore=score;bestSpot={k,model,x,z,y,tilt}}
 }
 prizes.push(bestSpot);
}
 ended=false;ui(guide);}

}

}
function clamp(v,a,b){return Math.max(a,Math.min(v,b))}
function insertCoin(){
 if(ended||grab||paid||coinTime!==null)return;
 if(waiting)return;
 if(coins<cost)return ui('Cần '+cost+' vé Noel cho 1 lượt. Săn quái để kiếm thêm vé.');
 if(!parentWin){coins-=cost;coinTime=0;return ui('Đang nạp vé…')}
 waiting=true;post({type:'claw:spend'})
}
function aim(x,z=depth){if(paid&&!grab&&cameraPhase===1){claw=clamp(x,22,144);depth=clamp(z,10,52)}}
function drop(){if(ended||grab||!paid)return;paid=false;stick=null;
 const target=contactAt(claw,depth);
 const extra=rareExtra(target,claw,depth);
 grab={age:0,x:claw,z:depth,target,extra,slip:null,jostled:new Set(),rolling:[]};ui('Càng đang gắp…')}
function rareExtra(target,x,z,random=Math.random){
 if(!target)return null;
 const neighbor=prizes.find(p=>p!==target&&Math.hypot(p.x-x,p.z-z)<=13&&Math.abs(p.y-target.y)<=14);
 return neighbor&&random()<.01?neighbor:null
}
function restHeight(x,z,below){
 let height=91;
 for(const toy of below){
   const overlap=1-((x-toy.x)/14)**2-((z-toy.z)/10)**2;
   if(overlap>0)height=Math.max(height,toy.y+8*overlap);
 }
 return height
}
function settlePile(){
 const settled=[];
 for(const toy of prizes.slice().sort((a,b)=>a.y-b.y)){
   toy.y=restHeight(toy.x,toy.z,settled);settled.push(toy);
 }
}
function jostleNearbyToys(dt){
 const head=pose();
 if(grab.age<=.55){
